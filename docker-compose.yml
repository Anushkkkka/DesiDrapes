# Full local stack: `docker compose up --build`
#   Storefront  http://localhost:3000      API docs  http://localhost:4000/api/docs
#   n8n         http://localhost:5678      Mailpit   http://localhost:8025 (all outgoing email lands here)
# Values come from .env (see .env.example); everything has a safe local default.

name: desidrapes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: desidrapes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desidrapes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies Prisma migrations and the idempotent seed, then exits.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/desidrapes
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_FORMAT: json
      COOKIE_SECURE: "false" # plain http on localhost; leave unset behind HTTPS in production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/desidrapes
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-please}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      N8N_API_KEY: ${N8N_API_KEY:-local-n8n-service-key}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-admin@desidrapes.local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:1.123.5
    restart: unless-stopped
    # Imports the workflows committed in ./n8n on every start, then launches n8n.
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-n8n-encryption-key}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: ${TZ:-Australia/Sydney}
      TZ: ${TZ:-Australia/Sydney}
      # Read by the workflows via $env
      DESIDRAPES_API_URL: http://backend:4000
      DESIDRAPES_API_KEY: ${N8N_API_KEY:-local-n8n-service-key}
      DESIDRAPES_STORE_URL: http://localhost:3000
      DESIDRAPES_FROM_EMAIL: DesiDrapes <orders@desidrapes.local>
      DESIDRAPES_ADMIN_EMAIL: ${ADMIN_ALERT_EMAIL:-admin@desidrapes.local}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/bootstrap:ro
    depends_on:
      mailpit:
        condition: service_started

  # Local SMTP catcher: n8n sends real emails here and nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  n8n_data:
  uploads:
